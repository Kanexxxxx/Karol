<!--
  Ícone da aba do navegador.

  Mesma marca do ícone do app na Meta (`capas/icone-app-meta.png`), sem a
  palavra CARVALHO: a 16 px ela vira uma mancha borrada, conferido em teste
  lado a lado. O que sobrevive nesse tamanho é o K e a moldura.

  viewBox de 100 pra escalar limpo em qualquer tamanho que o navegador pedir.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#96702b" />
  <rect x="7" y="7" width="86" height="86" fill="none" stroke="#e4ce9d" stroke-width="2" opacity="0.5" />
  <text x="50" y="53" fill="#fbf7f0" font-family="Georgia, 'Times New Roman', serif"
        font-size="66" text-anchor="middle" dominant-baseline="central">K</text>
</svg>
